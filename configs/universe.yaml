# Universe definition.
#
# Seven of eight funds are iShares so that fund structure and NAV-striking
# convention are held roughly constant, leaving underlying liquidity as the
# variable that actually moves across the cross-section.
#
# SPY is a CONTROL, not a data point: same index as IVV, different issuer,
# and a UIT rather than an open-end fund. Agreement between the two validates
# the NAV convention; divergence exposes an issuer-specific artefact that an
# all-iShares universe would hide as common-mode error. Expect a small
# persistent SPY premium drag from the UIT structure's inability to reinvest
# dividends between distributions -- that is structural, not a bug.

sample:
  start: "2018-01-01"
  end: null # null => today

funds:
  - ticker: IVV
    name: iShares Core S&P 500 ETF
    sleeve: equity_us_large
    issuer: ishares
    foreign_session: false
    outlier_band_bps: 500
    role: primary

  - ticker: ITOT
    name: iShares Core S&P Total US Stock Market ETF
    sleeve: equity_us_total
    issuer: ishares
    foreign_session: false
    outlier_band_bps: 500
    role: primary

  - ticker: EWJ
    name: iShares MSCI Japan ETF
    sleeve: equity_intl_developed
    issuer: ishares
    # Tokyo is closed throughout the US session, so NAV is struck on a stale
    # foreign close. The resulting deviation is price discovery, not
    # mispricing. This fund is analysed separately.
    foreign_session: true
    outlier_band_bps: 500
    role: primary

  - ticker: LQD
    name: iShares iBoxx $ Investment Grade Corporate Bond ETF
    sleeve: credit_ig
    issuer: ishares
    foreign_session: false
    outlier_band_bps: 800
    role: primary

  - ticker: HYG
    name: iShares iBoxx $ High Yield Corporate Bond ETF
    sleeve: credit_hy
    issuer: ishares
    foreign_session: false
    outlier_band_bps: 800
    role: primary

  - ticker: EMB
    name: iShares J.P. Morgan USD Emerging Markets Bond ETF
    sleeve: debt_em
    issuer: ishares
    foreign_session: false
    outlier_band_bps: 1000
    role: primary

  - ticker: EEM
    name: iShares MSCI Emerging Markets ETF
    sleeve: equity_em
    issuer: ishares
    foreign_session: true
    outlier_band_bps: 1000
    role: primary

  - ticker: SPY
    name: SPDR S&P 500 ETF Trust
    sleeve: equity_us_large
    issuer: ssga
    foreign_session: false
    outlier_band_bps: 500
    role: control
